<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бренд-менеджер</title>
<meta name="description" content="Центр управления запуском бренда на маркетплейсе: чек-лист, аналитика, юнит-экономика. Работает офлайн.">
<meta name="theme-color" content="#1F6F63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-title">Бренд-менеджер</span>
      <span class="status-dot" id="status-dot" title="Синхронизировано"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
    </div>
    <nav class="tabs">
      <button class="tab-btn" data-nav="dashboard">Дашборд</button>
      <button class="tab-btn" data-nav="checklist">Чек-лист</button>
      <button class="tab-btn" data-nav="process">Процессы</button>
      <button class="tab-btn" data-nav="analytics">Аналитика</button>
      <button class="tab-btn" data-nav="economics">Юнит-экономика</button>
      <button class="tab-btn" data-nav="docs">Документы</button>
      <button class="tab-btn" data-nav="settings">Настройки</button>
    </nav>
  </header>
  <main class="wrap" id="app"></main>
  <div class="savebar"><span id="save-toast">Сохранено</span></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
